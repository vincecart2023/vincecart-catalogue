<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VinceCart – Catalogue de cartes de collection</title>
<meta name="description" content="Catalogue VinceCart : cartes NBA, football, Pokémon, Star Wars et autres cartes de collection. Retrouvez les articles et achetez via Vinted.">
<style>
:root{--ink:#15202b;--muted:#667085;--bg:#f6f7f9;--card:#fff;--teal:#007782;--teal2:#005d66;--line:#e8eaee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#073b40,#007782);color:#fff;padding:28px 18px 24px;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px #0002}
.wrap{max-width:1220px;margin:auto}.brand{display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:28px;margin:0}.tag{opacity:.9;margin-top:5px}
.vinted{background:#fff;color:var(--teal);padding:11px 15px;border-radius:10px;text-decoration:none;font-weight:800;white-space:nowrap}
.controls{display:grid;grid-template-columns:minmax(220px,1fr) 190px 190px;gap:10px;margin-top:18px}
input,select{border:0;border-radius:10px;padding:13px 14px;font-size:15px;outline:none}
main{max-width:1220px;margin:22px auto;padding:0 16px 60px}.summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 2px 8px #1018280a;display:flex;flex-direction:column}
.imgwrap{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.imgwrap img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:14px;color:#98a2b3;padding:20px;text-align:center}
.body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}.cat{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--teal);font-weight:800}.title{font-size:14px;font-weight:750;line-height:1.3;min-height:55px}.meta{font-size:12px;color:var(--muted)}.bottom{display:flex;justify-content:space-between;align-items:end;gap:8px;margin-top:auto}.price{font-size:18px;font-weight:900}.btn{background:var(--teal);color:#fff;text-decoration:none;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:800}.btn:hover{background:var(--teal2)}
.more{display:block;margin:24px auto 0;border:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.empty{padding:50px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){header{position:static}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr)}.brand{align-items:flex-start}}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:9px}.title{font-size:13px}.body{padding:9px}h1{font-size:23px}}
</style></head><body>
<header><div class="wrap"><div class="brand"><div><h1>VINCECART</h1><div class="tag">Cartes de collection • catalogue public</div></div><a class="vinted" href="https://www.vinted.fr/member/119357121-vincecart" target="_blank" rel="noopener">Voir mon Vinted ↗</a></div>
<div class="controls"><input id="q" type="search" placeholder="Rechercher un joueur, une série, une équipe…"><select id="cat"><option value="">Toutes les catégories</option></select><select id="sort"><option value="new">Plus récentes</option><option value="priceAsc">Prix croissant</option><option value="priceDesc">Prix décroissant</option><option value="popular">Plus vues</option><option value="liked">Plus aimées</option></select></div></div></header>
<main><div class="summary"><strong id="resultCount"></strong><span class="pill">NBA / Basket</span><span class="pill">Football</span><span class="pill">Pokémon</span><span class="pill">Star Wars</span><span class="pill">Gradées / PSA</span><span class="muted">Disponibilité à confirmer sur Vinted.</span></div><div id="grid" class="grid"></div><button id="more" class="more">Afficher plus</button></main>
<footer>Catalogue VinceCart • Les transactions sont réalisées sur Vinted.</footer>
<script src="data.js"></script><script>
const all=window.CATALOG_DATA||[];let shown=60;const q=document.querySelector('#q'),cat=document.querySelector('#cat'),sort=document.querySelector('#sort'),grid=document.querySelector('#grid'),count=document.querySelector('#resultCount'),more=document.querySelector('#more');
[...new Set(all.map(x=>x.category))].sort().forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;cat.appendChild(o)});
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function get(){let s=q.value.trim().toLowerCase();let a=all.filter(x=>(!cat.value||x.category===cat.value)&&(!s||(x.title+' '+x.description+' '+x.brand).toLowerCase().includes(s)));a=[...a];if(sort.value==='priceAsc')a.sort((a,b)=>(a.price??1e9)-(b.price??1e9));else if(sort.value==='priceDesc')a.sort((a,b)=>(b.price??-1)-(a.price??-1));else if(sort.value==='popular')a.sort((a,b)=>b.views-a.views);else if(sort.value==='liked')a.sort((a,b)=>b.favourites-a.favourites);else a.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));return a}
function render(reset=true){if(reset)shown=60;let a=get();count.textContent=`${a.length.toLocaleString('fr-FR')} carte${a.length>1?'s':''}`;let view=a.slice(0,shown);grid.innerHTML=view.map(x=>`<article class="card"><div class="imgwrap">${x.thumb?`<img loading="lazy" src="${esc(x.thumb)}" alt="${esc(x.title)}">`:'<div class="placeholder">Photo non fournie</div>'}</div><div class="body"><div class="cat">${esc(x.category)}</div><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.brand)}${x.status?' • '+esc(x.status):''}</div><div class="bottom"><div><div class="price">${x.price!=null?x.price.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €':'—'}</div><div class="meta">${x.views} vues • ${x.favourites} ♥</div></div><a class="btn" href="https://www.vinted.fr/member/119357121-vincecart" target="_blank" rel="noopener">Vinted ↗</a></div></div></article>`).join('');more.style.display=shown<a.length?'block':'none';if(!a.length)grid.innerHTML='<div class="empty">Aucune carte trouvée.</div>'}
q.addEventListener('input',()=>render());cat.addEventListener('change',()=>render());sort.addEventListener('change',()=>render());more.addEventListener('click',()=>{shown+=60;render(false)});render();
</script></body></html>
